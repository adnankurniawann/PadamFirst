[project]
name = "padamfirst-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.1",
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
